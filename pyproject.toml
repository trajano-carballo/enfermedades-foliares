[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "foliares"
version = "0.1.0"
description = "Brecha ID->OOD en enfermedades foliares (PlantVillage -> PlantDoc)"
requires-python = ">=3.11.4"
# Las dependencias viven en requirements.txt (en Colab torch ya está instalado).
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
