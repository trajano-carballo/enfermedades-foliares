# Config de notebooks/01b_depuracion_plantdoc.ipynb (sesión 5). Candidato: NO escribe en data/splits/.
# Rutas: configs/paths.yaml.
commit_plantdoc: 5467f6012d78d1c446145d5f582da6096f852ae8
semilla: 42
frac_test: 0.30                  # partición propia dev/test 70/30, estratificada por clase
umbral_duplicado: 6              # phash <= 6: duplicado mecánico; 7-10: los revisa un revisor (D3, 2026-10-09)
renombrados_csv: docs/bitacora/plantdoc_archivos_renombrados.csv
cache_hashes: hashes_plantdoc_candidatas.npz       # en DATA_ROOT/interim
planilla_revision: docs/bitacora/revision_etiquetas_planilla.csv
# Revisión humana de Tomato leaf / Bell_pepper leaf. D1 (2026-10-09): UN revisor; supera la regla de "Sesión 5 (2)".
# Se excluye una imagen si todos los `revisores_que_deciden` escribieron `descartar`. COMPLETA = las `filas_esperadas`
# filas con `revisor_1` en el vocabulario (minúscula exacta); si falta alguna => PROVISIONAL.
revision_etiquetas:
  filas_esperadas: 124
  revisores_que_deciden: [revisor_1]
  revisores_ignorados: [revisor_2]       # con valores: aviso y se ignoran
  vocabulario: [mantener, descartar]
  motivos: ["1", "2", "3"]               # 1 no es la especie; 2 no es una hoja; 3 nombre de enfermedad + lesiones visibles
# Pares de distancia 7-10 (listado: salida.pares_7_10, columna `decision_equipo`). D3 (2026-10-09): los revisa un solo
# revisor. `misma_foto` se une a los grupos de duplicados antes del split (clases distintas => se excluyen todas las
# copias; misma clase => se conserva la primera por ruta ordenada); `distinta` no se toca; vacío => PROVISIONAL.
pares_7_10:
  vocabulario: [misma_foto, distinta]
alertas: {min_test_por_clase: 10, min_dev_por_clase: 30}   # solo se avisa, no se corrige
frecuente_min_pares: 2           # combinaciones con >= N pares tienen ejemplo visual
salida:
  manifiesto: manifiesto_plantdoc_depurado.csv               # en DATA_ROOT/interim
  meta: manifiesto_plantdoc_depurado.meta.json
  pares_7_10: docs/bitacora/plantdoc_pares_7_10_revision.csv
  figuras: docs/figuras_sesion5
